<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARTNERKONTOR – Kundenbereich</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #102943;
      color: #26364a;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      padding: 22px;
      text-align: center;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    button {
      background: #176b87;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      color: #ffffff;
    }
  </style>
</head>

<body>

<header>
  <h1>PARTNERKONTOR</h1>
  <p>Mein Kundenbereich</p>
</header>

<main>
  <div class="card" id="customerCard">
    <h2>Mein Kundenkonto</h2>
    <p id="welcome">Kundenkonto wird geladen ...</p>
    <p id="customerNumber"></p>
    <button id="logoutButton">Abmelden</button>
  </div>

  <p id="status"></p>
</main>

<script>
  const SUPABASE_URL = "https://gzcsqwnkusvbngljqxbd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XK17n0IGaBcn6xVb0taypg_idMgx67I";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadCustomer() {
    const welcome = document.getElementById("welcome");
    const customerNumberElement =
      document.getElementById("customerNumber");

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      window.location.href = "login.html";
      return;
    }

    const user = sessionData.session.user;

    const { data: customer, error } = await supabaseClient
      .from("customers")
      .select("first_name, last_name, customer_number, status")
      .eq("auth_user_id", user.id)
      .maybeSingle();

    if (error) {
      welcome.textContent =
        "Kundenkonto konnte nicht geladen werden.";
      console.error("Kundenabfrage fehlgeschlagen:", error);
      return;
    }

    if (!customer) {
      welcome.textContent =
        "Es wurde kein Kundenkonto gefunden.";
      return;
    }

    // KUNDENZUGANG PRÜFEN
    // Aktive Kunden erhalten sofort Zugang.

    if (customer.status !== "active") {
      welcome.textContent =
        "Dein Kundenkonto ist noch nicht aktiv.";
      return;
    }

    welcome.textContent =
      "Willkommen " + customer.first_name + " " +
      customer.last_name + ".";

    customerNumberElement.textContent =
      "Deine Kundennummer: " + customer.customer_number;
  }


  // LOGOUT MIT PROTOKOLLIERUNG

  document.getElementById("logoutButton").addEventListener(
    "click",
    async () => {

      const logoutButton =
        document.getElementById("logoutButton");

      const status =
        document.getElementById("status");

      logoutButton.disabled = true;
      logoutButton.textContent = "Abmeldung läuft ...";

      // Logout im Protokoll speichern

      const { error: auditError } = await supabaseClient.rpc(
        "log_my_auth_event",
        { p_event_type: "logout" }
      );

      if (auditError) {
        console.error(
          "Logout-Protokollierung fehlgeschlagen:",
          auditError
        );

        status.textContent =
          "Hinweis: Der Logout konnte nicht protokolliert werden.";
      }

      // Benutzer abmelden

      const { error: logoutError } =
        await supabaseClient.auth.signOut();

      if (logoutError) {
        console.error(
          "Abmeldung fehlgeschlagen:",
          logoutError
        );

        status.textContent =
          "Abmeldung fehlgeschlagen: " + logoutError.message;

        logoutButton.disabled = false;
        logoutButton.textContent = "Erneut abmelden";
        return;
      }

      window.location.href = "login.html";
    }
  );

  loadCustomer();
</script>

</body>
</html>
