
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTNERKONTOR – Kundenregistrierung</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102943;
  color: #26364a;
  min-height: 100vh;
}

header {
  padding: 22px;
  text-align: center;
  color: white;
  border-bottom: 3px solid #c49b55;
}

header span {
  color: #c49b55;
}

main {
  max-width: 550px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
  color: #102943;
  text-align: center;
  font-size: 25px;
}

.intro {
  text-align: center;
  line-height: 1.5;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 17px 0 7px;
  font-weight: bold;
}

.required {
  color: #b33a32;
}

input:not([type="checkbox"]) {
  display: block;
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd3dc;
  border-radius: 6px;
  font-size: 15px;
  background: #fff;
}

input:focus {
  outline: none;
  border-color: #c49b55;
  box-shadow: 0 0 0 2px rgba(196,155,85,0.15);
}

.privacy-link {
  display: block;
  text-align: center;
  padding: 13px;
  margin-top: 25px;
  border: 1px solid #c49b55;
  border-radius: 6px;
  color: #102943;
  text-decoration: none;
  font-weight: bold;
}

.privacy-link:hover {
  background: #f8f3e9;
}

.privacy-check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 18px;
  font-weight: normal;
  line-height: 1.5;
}

.privacy-check input {
  width: auto;
  flex-shrink: 0;
  margin-top: 4px;
}

.privacy-check a {
  color: #176b87;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  background: #c49b55;
  color: #102943;
  border: 0;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #d5b574;
}

#message {
  margin-top: 18px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.login-link {
  text-align: center;
  margin-top: 22px;
}

a {
  color: #176b87;
}

.hint {
  font-size: 12px;
  color: #697586;
  margin-top: 5px;
}

@media (max-width: 600px) {
  main {
    margin: 15px auto;
    padding: 12px;
  }

  .card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h2>PARTNER<span>KONTOR</span></h2>
  <p>Ihr persönlicher Kundenbereich</p>
</header>

<main>
<div class="card">

  <h1>Kundenkonto erstellen</h1>

  <p class="intro">
    Registrieren Sie sich für Ihren persönlichen Zugang.
    Füllen Sie bitte die folgenden Felder aus.
  </p>

  <form id="registrationForm">

    <label for="firstName">
      Vorname <span class="required">*</span>
    </label>
    <input id="firstName" type="text" required autocomplete="given-name">

    <label for="lastName">
      Nachname <span class="required">*</span>
    </label>
    <input id="lastName" type="text" required autocomplete="family-name">

    <label for="email">
      E-Mail-Adresse <span class="required">*</span>
    </label>
    <input id="email" type="email" required autocomplete="email">

    <label for="phone">Telefon</label>
    <input id="phone" type="tel" autocomplete="tel">

    <label for="street">
      Straße und Hausnummer <span class="required">*</span>
    </label>
    <input id="street" type="text" required autocomplete="street-address">

    <label for="postalCode">
      Postleitzahl <span class="required">*</span>
    </label>
    <input
      id="postalCode"
      type="text"
      required
      pattern="[0-9]{5}"
      maxlength="5"
      inputmode="numeric"
      autocomplete="postal-code"
      title="Bitte eine fünfstellige Postleitzahl eingeben."
    >

    <label for="city">
      Wohnort <span class="required">*</span>
    </label>
    <input
      id="city"
      type="text"
      list="citySuggestions"
      autocomplete="off"
      required
    >
    <datalist id="citySuggestions"></datalist>

    <label for="birthDate">Geburtsdatum</label>
<input id="birthDate" type="date" autocomplete="bday">

<label for="customerRequest">
  Ihr Anliegen <span class="required">*</span>
</label>
<textarea
  id="customerRequest"
  required
  rows="4"
  placeholder="Beschreiben Sie kurz Ihr Anliegen..."
  style="width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:6px;font-size:15px;font-family:Arial,sans-serif;resize:vertical;"
></textarea>
    <label for="password">
      Passwort <span class="required">*</span>
    </label>
<div style="position:relative;">
  <input
    id="password"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
    style="padding-right:45px;"
  >
  <button type="button"
    onclick="togglePassword('password', this)"
    aria-label="Passwort anzeigen"
    style="position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;margin:0;padding:6px;background:transparent;color:#102943;border:0;cursor:pointer;font-size:19px;">
    ◉
  </button>
</div>
    <p class="hint">Mindestens 8 Zeichen.</p>

    <label for="passwordRepeat">
      Passwort wiederholen <span class="required">*</span>
    </label>
    <input
      id="passwordRepeat"
      type="password"
      minlength="8"
      required
      autocomplete="new-password"
    >

    <a href="datenschutz.html"
       class="privacy-link"
       target="_blank"
       rel="noopener">
      Datenschutzerklärung ansehen
    </a>

    <label class="privacy-check">
      <input type="checkbox" id="privacyAccepted" required>
      <span>
        Ich habe die
        <a href="datenschutz.html" target="_blank" rel="noopener">
          Datenschutzerklärung
        </a>
        gelesen und zur Kenntnis genommen.
        <span class="required">*</span>
      </span>
    </label>

    <button type="submit">
      Kundenkonto erstellen
    </button>

  </form>

  <p id="message"></p>

  <p class="login-link">
    Sie haben bereits ein Konto?
    <a href="login.html">Hier anmelden</a>
  </p>

</div>
</main>

<script>
const SUPABASE_URL = "https://gzcsqwnkusvbngljqxbd.supabase.co";
const SUPABASE_KEY = "sb_publishable_XK17n0IGaBcn6xVb0taypg_idMgx67I";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// Automatische Ortssuche anhand der Postleitzahl

const postalCodeInput = document.getElementById("postalCode");
const cityInput = document.getElementById("city");
const citySuggestions = document.getElementById("citySuggestions");

postalCodeInput.addEventListener("input", async function() {

  const postalCode = postalCodeInput.value.trim();

  citySuggestions.innerHTML = "";
  cityInput.value = "";

  if (!/^[0-9]{5}$/.test(postalCode)) return;

  const { data, error } = await supabaseClient
    .from("postal_code_coordinates")
    .select("place_name")
    .eq("postal_code", postalCode)
    .order("place_name");

  if (error) {
    console.error("Fehler bei der Ortssuche:", error);
    return;
  }

  const uniquePlaces = [...new Set(
    data.map(item => item.place_name)
  )];

  uniquePlaces.forEach(place => {
    const option = document.createElement("option");
    option.value = place;
    citySuggestions.appendChild(option);
  });

});

// Kundenregistrierung

document.getElementById("registrationForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const message = document.getElementById("message");

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const street = document.getElementById("street").value.trim();
  const postalCode = document.getElementById("postalCode").value.trim();
  const city = document.getElementById("city").value.trim();
  const birthDate = document.getElementById("birthDate").value;
const customerRequest = document.getElementById("customerRequest").value.trim();
  const password = document.getElementById("password").value;
  const passwordRepeat = document.getElementById("passwordRepeat").value;

  if (password !== passwordRepeat) {
    message.textContent = "Die Passwörter stimmen nicht überein.";
    return;
  }

  if (password.length < 8) {
    message.textContent = "Das Passwort muss mindestens 8 Zeichen enthalten.";
    return;
  }

  message.textContent = "Registrierung wird durchgeführt ...";

  
  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        account_type: "customer",
        first_name: firstName,
        last_name: lastName,
        phone: phone || null,
        street: street,
        postal_code: postalCode,
        city: city,
birth_date: birthDate || null,
customer_request: customerRequest
      }
    }
  });

  if (error) {
    message.textContent =
      "Registrierung fehlgeschlagen: " + error.message;
    return;
  }

  if (!data.user) {
    message.textContent =
      "Es konnte kein Benutzerkonto erstellt werden.";
    return;
  }

  message.textContent =
    "Registrierung erfolgreich! Bitte bestätigen Sie Ihre E-Mail-Adresse über den Link in Ihrem Postfach. Anschließend können Sie sich mit Ihren Zugangsdaten anmelden.";

  document.getElementById("registrationForm").reset();
  });
</script>

</body>
</html>
