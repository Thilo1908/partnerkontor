
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTNERKONTOR – Kundenregistrierung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102943;
  color: #26364a;
  min-height: 100vh;
}
header {
  padding: 22px;
  text-align: center;
  color: white;
  border-bottom: 3px solid #c49b55;
}
header span { color: #c49b55; }
main {
  max-width: 550px;
  margin: 35px auto;
  padding: 20px;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 12px;
}
h1 { color: #102943; text-align: center; }
label {
  display: block;
  margin: 15px 0 6px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd3dc;
  border-radius: 6px;
  font-size: 15px;
}
button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  background: #c49b55;
  color: #102943;
  border: 0;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}
#message {
  margin-top: 18px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
a { color: #176b87; }
</style>
</head>
<body>

<header>
  <h2>PARTNER<span>KONTOR</span></h2>
  <p>Ihr persönlicher Kundenbereich</p>
</header>

<main>
<div class="card">
  <h1>Kundenkonto erstellen</h1>
  <p>Registrieren Sie sich für Ihren persönlichen Zugang.</p>

  <form id="registrationForm">
    <label for="firstName">Vorname</label>
    <input id="firstName" type="text" required>

    <label for="lastName">Nachname</label>
    <input id="lastName" type="text" required>

    <label for="email">E-Mail-Adresse</label>
    <input id="email" type="email" required autocomplete="email">

    <label for="phone">Telefon</label>
    <input id="phone" type="tel">

    <label for="street">Straße und Hausnummer</label>
    <input id="street" type="text">

    <label for="postalCode">Postleitzahl</label>
    <input id="postalCode" type="text">

    <label for="city">Wohnort</label>
<input id="city" type="text" list="citySuggestions" autocomplete="off">
<datalist id="citySuggestions"></datalist>

    <label for="password">Passwort</label>
    <input id="password" type="password" minlength="8" required autocomplete="new-password">

    <label for="passwordRepeat">Passwort wiederholen</label>
    <input id="passwordRepeat" type="password" minlength="8" required autocomplete="new-password">

    <button type="submit">Kundenkonto erstellen</button>
  </form>

  <p id="message"></p>
  <p>Sie haben bereits ein Konto? <a href="login.html">Hier anmelden</a></p>
</div>
</main>

<script>
const SUPABASE_URL = "https://gzcsqwnkusvbngljqxbd.supabase.co";
const SUPABASE_KEY = "sb_publishable_XK17n0IGaBcn6xVb0taypg_idMgx67I";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
// Automatische Ortssuche anhand der Postleitzahl
const postalCodeInput = document.getElementById("postalCode");
const cityInput = document.getElementById("city");
const citySuggestions = document.getElementById("citySuggestions");

postalCodeInput.addEventListener("input", async function () {
  const postalCode = postalCodeInput.value.trim();

  citySuggestions.innerHTML = "";
  cityInput.value = "";

  if (postalCode.length !== 5) return;

  const { data, error } = await supabaseClient
    .from("postal_code_coordinates")
    .select("place_name")
    .eq("postal_code", postalCode)
    .order("place_name");

  if (error) {
    console.error("Fehler bei der Ortssuche:", error);
    return;
  }

  const uniquePlaces = [...new Set(data.map(item => item.place_name))];

  uniquePlaces.forEach(place => {
    const option = document.createElement("option");
    option.value = place;
    citySuggestions.appendChild(option);
  });
});
document.getElementById("registrationForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = document.getElementById("message");
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const street = document.getElementById("street").value.trim();
  const postalCode = document.getElementById("postalCode").value.trim();
  const city = document.getElementById("city").value.trim();
  const password = document.getElementById("password").value;
  const passwordRepeat = document.getElementById("passwordRepeat").value;

  if (password !== passwordRepeat) {
    message.textContent = "Die Passwörter stimmen nicht überein.";
    return;
  }

  if (password.length < 8) {
    message.textContent = "Das Passwort muss mindestens 8 Zeichen enthalten.";
    return;
  }

  message.textContent = "Registrierung wird durchgeführt ...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Registrierung fehlgeschlagen: " + error.message;
    return;
  }

  if (!data.user) {
    message.textContent = "Es konnte kein Benutzerkonto erstellt werden.";
    return;
  }

  if (!data.session) {
    message.textContent = "Bitte bestätigen Sie zuerst Ihre E-Mail-Adresse. Danach können Sie sich anmelden.";
    return;
  }

  const { error: customerError } = await supabaseClient
    .from("customers")
    .insert({
      auth_user_id: data.user.id,
      first_name: firstName,
      last_name: lastName,
      email: email,
      phone: phone || null,
      street: street || null,
      postal_code: postalCode || null,
      city: city || null,
      status: "pending"
    });

  if (customerError) {
    message.textContent =
      "Login wurde erstellt, aber das Kundenprofil konnte nicht gespeichert werden. Bitte den Support kontaktieren.";
    return;
  }

  message.textContent =
    "Registrierung erfolgreich! Ihr Kundenkonto wartet jetzt auf die Freigabe. Sie werden zur Anmeldung weitergeleitet.";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 3000);
});
</script>

</body>
</html>
