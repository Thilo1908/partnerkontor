
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTNERKONTOR – Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102943;
  color: #26364a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 7%;
  color: white;
  border-bottom: 3px solid #c49b55;
  font-size: 23px;
  font-weight: bold;
}

header span {
  color: #c49b55;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 440px;
  padding: 38px;
  border-radius: 12px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.login-box h1 {
  text-align: center;
  color: #102943;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 30px;
  font-size: 14px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d5dce4;
  border-radius: 6px;
  font-size: 15px;
}

input:focus {
  outline: 2px solid #c49b55;
}

.password-field {
  display: flex;
  align-items: center;
  border: 1px solid #d5dce4;
  border-radius: 6px;
  margin-top: 0;
}

.password-field input {
  border: none;
  flex: 1;
  min-width: 0;
}

.password-field input:focus {
  outline: none;
}

.password-toggle {
  width: auto;
  margin: 0;
  padding: 10px 13px;
  background: none;
  color: #102943;
  font-size: 22px;
  border: none;
  cursor: pointer;
}

.password-toggle:hover {
  background: #f0f2f5;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  background: #c49b55;
  border: none;
  border-radius: 6px;
  color: #102943;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #d6ad69;
}

.message {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 22px;
  color: #c49b55;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  PARTNER<span>KONTOR</span>
</header>

<main>
  <div class="login-box">

    <h1>Willkommen zurück</h1>

    <p class="subtitle">
      Ihr persönlicher Zugang zum PARTNERKONTOR
    </p>

    <form id="loginForm" autocomplete="on">

      <label for="email">E-Mail-Adresse</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Ihre E-Mail-Adresse"
        autocomplete="username"
        required
      >

      <label for="password">Passwort</label>

      <div class="password-field">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ihr Passwort"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          id="togglePassword"
          class="password-toggle"
          aria-label="Passwort anzeigen"
          aria-pressed="false"
        >
          &#128065;
        </button>

      </div>

      <button type="submit">
        Sicher anmelden
      </button>

    </form>

    <div class="message" id="message"></div>

  </div>
</main>

<footer>
  PARTNERKONTOR – Vertrauen · Verbindung · Zusammenarbeit
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://gzcsqwnkusvbngljqxbd.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_XK17n0IGaBcn6xVb0taypg_idMgx67I";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// PASSWORTANZEIGE

const passwordInput = document.getElementById("password");

const togglePassword = document.getElementById("togglePassword");

function showPassword() {
  passwordInput.type = "text";
  togglePassword.setAttribute("aria-pressed", "true");
  togglePassword.setAttribute("aria-label", "Passwort verbergen");
}

function hidePassword() {
  passwordInput.type = "password";
  togglePassword.setAttribute("aria-pressed", "false");
  togglePassword.setAttribute("aria-label", "Passwort anzeigen");
}

togglePassword.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  showPassword();
});

document.addEventListener("pointerup", hidePassword);

document.addEventListener("pointercancel", hidePassword);

window.addEventListener("blur", hidePassword);


// TASTATURBEDIENUNG

togglePassword.addEventListener("keydown", function(event) {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    showPassword();
  }
});

togglePassword.addEventListener("keyup", function(event) {
  if (event.key === " " || event.key === "Enter") {
    hidePassword();
  }
});


// ANMELDUNG

document.getElementById("loginForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const message = document.getElementById("message");

  message.textContent = "Anmeldung wird geprüft ...";

  const email = document.getElementById("email").value;

  const password = passwordInput.value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  hidePassword();

  if (error) {
    message.textContent = "Anmeldung fehlgeschlagen: " + error.message;
    return;
  }

  message.textContent = "Anmeldung erfolgreich. Ihr Zugang wird geprüft.";

  const { data: admin, error: adminError } = await supabaseClient.rpc("is_app_admin");

  if (adminError) {
    message.textContent = "Anmeldung erfolgreich, aber die Berechtigungen konnten nicht geprüft werden.";
    return;
  }

if (admin) {
  message.textContent = "Administrator-Anmeldung erfolgreich.";
  window.location.href = "admin.html";
  return;
} else {
  message.textContent = "Angemeldet. Die Zuordnung Ihres Partner- oder Kundenzugangs wird eingerichtet.";
}

});

</script>

</body>
</html>
