
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTNERKONTOR – Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102943;
  color: #26364a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 7%;
  color: white;
  border-bottom: 3px solid #c49b55;
  font-size: 23px;
  font-weight: bold;
}

header span { color: #c49b55; }

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 440px;
  padding: 38px;
  border-radius: 12px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.login-box h1 {
  text-align: center;
  color: #102943;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 30px;
  font-size: 14px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d5dce4;
  border-radius: 6px;
  font-size: 15px;
}

input:focus { outline: 2px solid #c49b55; }

.password-field {
  display: flex;
  align-items: center;
  border: 1px solid #d5dce4;
  border-radius: 6px;
  margin-top: 0;
}

.password-field input {
  border: none;
  flex: 1;
  min-width: 0;
}

.password-field input:focus { outline: none; }

.password-toggle {
  width: auto;
  margin: 0;
  padding: 10px 13px;
  background: none;
  color: #102943;
  font-size: 22px;
  border: none;
  cursor: pointer;
}

.password-toggle:hover { background: #f0f2f5; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  background: #c49b55;
  border: none;
  border-radius: 6px;
  color: #102943;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover { background: #d6ad69; }

.message {
  margin-top: 18px;
  text-align: center;
  font-size: 14px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 22px;
  color: #c49b55;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  PARTNER<span>KONTOR</span>
</header>

<main>
  <div class="login-box">

    <h1>Willkommen zurück</h1>

    <p class="subtitle">
      Ihr persönlicher Zugang zum PARTNERKONTOR
    </p>

    <form id="loginForm" autocomplete="on">

      <label for="email">E-Mail-Adresse</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Ihre E-Mail-Adresse"
        autocomplete="username"
        required
      >

      <label for="password">Passwort</label>

      <div class="password-field">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ihr Passwort"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          id="togglePassword"
          class="password-toggle"
          aria-label="Passwort anzeigen"
          aria-pressed="false"
        >
          &#128065;
        </button>

      </div>

      <button type="submit">
        Sicher anmelden
      </button>

    </form>
    
<!-- PASSWORT FÜR EINGELADENE PARTNER FESTLEGEN -->
<div id="passwordSetup" style="display:none; margin-top:20px;">

  <h2>Passwort festlegen</h2>
  <p>Willkommen bei PARTNERKONTOR. Bitte lege dein persönliches Passwort fest.</p>

  <form id="passwordSetupForm">

    <label for="newPassword">Neues Passwort</label>

    <div class="password-field">
      <input
        type="password"
        id="newPassword"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Mindestens 8 Zeichen"
      >
      <button
        type="button"
        class="password-toggle"
        onclick="toggleSetupPassword('newPassword', this)"
        aria-label="Passwort anzeigen"
      >&#128065;</button>
    </div>

    <label for="confirmPassword">Passwort wiederholen</label>

    <div class="password-field">
      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Passwort erneut eingeben"
      >
      <button
        type="button"
        class="password-toggle"
        onclick="toggleSetupPassword('confirmPassword', this)"
        aria-label="Passwort anzeigen"
      >&#128065;</button>
    </div>

    <button type="submit">Passwort speichern</button>

  </form>

</div>


    <div class="message" id="message"></div>

  </div>
</main>

<footer>
  PARTNERKONTOR – Vertrauen · Verbindung · Zusammenarbeit
</footer>

<script>function toggleSetupPassword(id, button) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    button.setAttribute("aria-label", "Passwort verbergen");
  } else {
    input.type = "password";
    button.setAttribute("aria-label", "Passwort anzeigen");
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://gzcsqwnkusvbngljqxbd.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_XK17n0IGaBcn6xVb0taypg_idMgx67I";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// PASSWORTANZEIGE

const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

function showPassword() {
  passwordInput.type = "text";
  togglePassword.setAttribute("aria-pressed", "true");
  togglePassword.setAttribute("aria-label", "Passwort verbergen");
}

function hidePassword() {
  passwordInput.type = "password";
  togglePassword.setAttribute("aria-pressed", "false");
  togglePassword.setAttribute("aria-label", "Passwort anzeigen");
}

togglePassword.addEventListener("pointerdown", function(event) {
  event.preventDefault();
  showPassword();
});

document.addEventListener("pointerup", hidePassword);
document.addEventListener("pointercancel", hidePassword);
window.addEventListener("blur", hidePassword);


// TASTATURBEDIENUNG

togglePassword.addEventListener("keydown", function(event) {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    showPassword();
  }
});

togglePassword.addEventListener("keyup", function(event) {
  if (event.key === " " || event.key === "Enter") {
    hidePassword();
  }
});


// ANMELDUNG

document.getElementById("loginForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const message = document.getElementById("message");

  message.textContent = "Anmeldung wird geprüft ...";

  const email = document.getElementById("email").value.trim();
  const password = passwordInput.value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  hidePassword();

  if (error) {
    message.textContent = "Anmeldung fehlgeschlagen: " + error.message;
    return;
  }

  message.textContent = "Anmeldung erfolgreich. Das Protokoll wird erstellt ...";


  // LOGIN IM ZENTRALEN PROTOKOLL SPEICHERN

  const { error: auditError } = await supabaseClient.rpc(
    "log_my_auth_event",
    { p_event_type: "login" }
  );

  if (auditError) {
    console.error("Login-Protokollierung fehlgeschlagen:", auditError);
  }


  // ADMINISTRATOR PRÜFEN

  const { data: admin, error: adminError } =
    await supabaseClient.rpc("is_app_admin");

  if (adminError) {
    message.textContent =
      "Anmeldung erfolgreich, aber die Berechtigungen konnten nicht geprüft werden.";
    return;
  }

  if (admin) {
    message.textContent = "Administrator-Anmeldung erfolgreich.";
    window.location.href = "admin.html";
    return;
  }


  // PARTNER PRÜFEN

  const { data: partner, error: partnerError } = await supabaseClient
    .from("partners")
    .select("id, partner_number, status")
    .eq("auth_user_id", data.user.id)
    .maybeSingle();

  if (partnerError) {
    message.textContent =
      "Partnerprüfung fehlgeschlagen: " + partnerError.message;
    return;
  }

  if (partner && partner.status === "approved") {
    message.textContent = "Partner-Anmeldung erfolgreich.";
    window.location.href = "partner.html";
    return;
  }


  // KUNDE PRÜFEN

  const { data: customer, error: customerError } = await supabaseClient
    .from("customers")
    .select("id, status")
    .eq("auth_user_id", data.user.id)
    .maybeSingle();

  if (customerError) {
    message.textContent =
      "Kundenprüfung fehlgeschlagen: " + customerError.message;
    return;
  }

  if (customer && customer.status === "approved") {
    message.textContent = "Kunden-Anmeldung erfolgreich.";
    window.location.href = "customer.html";
    return;
  }

  message.textContent =
    "Angemeldet, aber noch kein freigegebener Kunden- oder Partnerzugang zugeordnet.";

});

// PASSWORT-EINRICHTUNG FÜR EINGELADENE PARTNER

const passwordSetup = document.getElementById("passwordSetup");
const passwordSetupForm = document.getElementById("passwordSetupForm");
const loginForm = document.getElementById("loginForm");

const inviteParams = new URLSearchParams(
  window.location.hash.substring(1)
);

const inviteType =
  inviteParams.get("type") ||
  new URLSearchParams(window.location.search).get("type");

if (inviteType === "invite" || inviteType === "recovery") {
  passwordSetup.style.display = "block";
  loginForm.style.display = "none";

  document.getElementById("message").textContent =
    "Bitte lege jetzt dein persönliches Passwort fest.";
}

passwordSetupForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  if (newPassword.length < 8) {
    message.textContent = "Das Passwort muss mindestens 8 Zeichen haben.";
    return;
  }

  if (newPassword !== confirmPassword) {
    message.textContent = "Die beiden Passwörter stimmen nicht überein.";
    return;
  }

  message.textContent = "Passwort wird gespeichert ...";

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword
  });

  if (error) {
    message.textContent = "Fehler: " + error.message;
    return;
  }

  message.textContent =
    "Passwort erfolgreich gespeichert. Du wirst weitergeleitet ...";

  window.location.href = "partner.html";
});

</script>

</body>
</html>
